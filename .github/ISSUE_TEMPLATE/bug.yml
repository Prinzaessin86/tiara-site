# GENERATED FILE. Do not edit.
# Source:     .github/issue-fields.psv
# Regenerate: sh scripts/gen-issue-forms.sh
name: "Bug"
description: "Something that used to work, or should work, does not."
title: "[Bug]: "
labels:
  - "bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One or two sentences, in plain language. One bug per ticket: if you are describing three things, file three."
      placeholder: |
        What is wrong, in one or two sentences.
        e.g. The card sheet dismisses itself when the phone rotates.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Repro or Reference"
      description: "Numbered steps someone else could follow. If steps do not apply, a screenshot or a device note instead."
      placeholder: |
        1. Open the Today screen
        2. Tap a card, then rotate to landscape
        3. The sheet closes
        
        Device: iPhone 15, iOS 18.2
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What should have happened at the last step above."
      placeholder: |
        The sheet stays open and re-lays out for the new width.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What happened instead. Include the error text if there is one."
      placeholder: |
        The sheet closes and the scroll position is lost.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance"
      description: "What you will look at to decide this is done. A judgement is allowed here. This text is fixed at filing and compared against the filed version at every lane move, so write it as if someone else has to read it."
      placeholder: |
        The sheet stays open through a rotation, and the scroll position is where I left it.
    validations:
      required: true
  - type: dropdown
    id: deliverable
    attributes:
      label: "Deliverable"
      description: "What comes back when this is done. Choose by what you want, not by how it will be built. At the lane move the agent points at the thing, and the gate checks it is of this shape and in the right place."
      options:
        - "code: a change committed in the repo"
        - "document: a written file committed at a path"
        - "decision: a proposal in docs/decisions/proposed for you to approve"
        - "investigation: an answer written on this ticket"
        - "manual: you will look at it yourself. Never blocks"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      description: "Which files or areas this work should touch. Checked at close against the files in commits citing this ticket, so it catches doing more, not doing less."
      placeholder: |
        Sources/Today/CardSheet.swift and its tests. Nothing in the design system.
    validations:
      required: true
