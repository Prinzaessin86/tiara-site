name: "Chore"
description: "Maintenance, cleanup, or infrastructure work with no user visible behaviour change."
title: "[Chore]: "
labels:
  - "chore"
body:
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One or two sentences. What this is, in plain language."
      placeholder: |
        What this is, in one or two sentences.
        e.g. Delete the unused colour tokens from the design system.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Repro or Reference"
      description: "Optional. The file, script or system this touches."
      placeholder: |
        Optional. What this touches.
        e.g. Sources/Design/Tokens.swift
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: "Reason"
      description: "Why now. What breaks or drifts if this waits. \"Tidiness\" is not a reason."
      placeholder: |
        What breaks or drifts if this waits.
        e.g. Three tokens no longer match the palette, so new screens pick the wrong one.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance"
      description: "What you will look at to decide this is done. A judgement is allowed here. This text is fixed at filing and compared against the filed version at every lane move, so write it as if someone else has to read it."
      placeholder: |
        make conform is green, and it fails on an induced case rather than passing because there was nothing to check.
    validations:
      required: true
  - type: dropdown
    id: deliverable
    attributes:
      label: "Deliverable"
      description: "What comes back when this is done. Choose by what you want, not by how it will be built. At the lane move the agent points at the thing, and the gate checks it is of this shape and in the right place."
      options:
        - "code: a change committed in the repo"
        - "document: a written file committed at a path"
        - "decision: a proposal in docs/decisions/proposed for you to approve"
        - "investigation: an answer written on this ticket"
        - "manual: you will look at it yourself. Never blocks"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      description: "Which files or areas this work should touch. Checked at close against the files in commits citing this ticket, so it catches doing more, not doing less."
      placeholder: |
        scripts/conform.sh only. No change to the vendored hooks.
    validations:
      required: true
  - type: dropdown
    id: global
    attributes:
      label: "Global"
      description: "Almost always leave this blank. Tick yes only when the work genuinely lands in more than one repo and no single one is its home (FD-0016). NOT ENFORCED YET: nothing reads this until _ticketflow#31, so today it is a note."
      options:
        - "no: this work lands in one repo"
        - "yes: this work spans several repos"
    validations:
      required: false
  - type: dropdown
    id: repos
    attributes:
      label: "Repos"
      description: "The repos this work spans, if Global is yes. Ignore it otherwise. Each named repo owes the deliverable above: a commit for code, the named file for document and decision. Investigation and manual owe nothing, having no per-repo artefact."
      multiple: true
      options:
        - "_bootstrap"
        - "_ticketflow"
        - "BetterBubbly"
        - "Bubbles"
        - "Dressie"
        - "Jewels"
        - "Octobrain"
        - "PackMagic"
        - "PagingDrDaddy"
        - "Podaknows"
        - "PodaProject"
        - "rainybow"
        - "SparkleReef"
        - "TentaclePit"
        - "tiara"
        - "tiara-site"
    validations:
      required: false
